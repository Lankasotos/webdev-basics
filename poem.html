<!DOCTYPE html>
<!-- 粒子诗 · 李贺《苦昼短》 学习要点:Canvas、getImageData 采样、粒子系统、动画循环 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粒子诗 · 苦昼短</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 本页覆盖共享样式:全屏画布、无滚动 */
    body {
      margin: 0;
      overflow: hidden;
      background: #10141f;
    }
    #stage {
      display: block;
      cursor: crosshair;
    }
    .hint {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(245, 215, 110, 0.55);
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      pointer-events: none; /* 提示文字不挡鼠标 */
      z-index: 2;
    }
    .back {
      position: fixed;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 2;
    }
    .back a {
      color: rgba(245, 215, 110, 0.5);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back a:hover {
      color: #f5d76e;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <p class="hint">移动鼠标:文字散开 · 移开鼠标:文字聚拢</p>
  <p class="back"><a href="index.html">← 返回首页</a></p>
  <script src="poem.js"></script>
</body>
</html>
